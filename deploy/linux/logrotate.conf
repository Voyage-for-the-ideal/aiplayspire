/home/ubuntu/aiplayspire-runtime/logs/agent/*.log
/home/ubuntu/aiplayspire-runtime/logs/gateway/*.log
/home/ubuntu/aiplayspire-runtime/logs/gateway/requests.jsonl {
    su ubuntu ubuntu
    daily
    maxsize 20M
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
