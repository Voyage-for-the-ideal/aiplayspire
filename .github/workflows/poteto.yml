name: Regression evidence
on: [pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tools/test_commit_scope.py
      - run: bash battle_engine/build.sh 2
      - run: python3 deploy/headless/release_worker.py verify battle_engine/bin/battle-engine-worker
      - name: Reject swapped worker and historical unoptimized build
        shell: bash
        run: |
          set -euo pipefail
          worker=battle_engine/bin/battle-engine-worker
          cp "$worker" "$worker.release.json" "$RUNNER_TEMP/"
          printf x >> "$RUNNER_TEMP/battle-engine-worker"
          if python3 deploy/headless/release_worker.py verify "$RUNNER_TEMP/battle-engine-worker" 2> "$RUNNER_TEMP/rejected"; then exit 1; fi
          grep -q 'BUILD_HEADLESS_WITH_RELEASE_PRESET: worker and manifest differ' "$RUNNER_TEMP/rejected"
          cmake -S battle_engine -B "$RUNNER_TEMP/unoptimized" -DCMAKE_BUILD_TYPE=Debug "-DBATTLE_ENGINE_OUTPUT_DIR=$RUNNER_TEMP/unoptimized/bin"
          cmake --build "$RUNNER_TEMP/unoptimized" --target battle-engine-worker --parallel 2
          if python3 deploy/headless/release_worker.py stamp "$RUNNER_TEMP/unoptimized/bin/battle-engine-worker" 2> "$RUNNER_TEMP/rejected"; then exit 1; fi
          grep -q 'BUILD_HEADLESS_WITH_RELEASE_PRESET: worker does not report Release' "$RUNNER_TEMP/rejected"
